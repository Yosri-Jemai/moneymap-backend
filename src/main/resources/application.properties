# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/moneymap
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.activation.url=${MONEY_MAP_BACKEND_URL}
server.servlet.context-path=/api/v1

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Email Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${BREVO_FROM_EMAIL}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=18000000

money.map.frontend.url=${MONEY_MAP_FRONTEND_URL}

spring.profiles.active=prod